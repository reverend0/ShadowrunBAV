# Vehicle design tables from Shadowrun Sixth World's Double Clutch,
# "Build Your Dream" (pp. 147–157). Names and numbers only: what each
# choice does is calculated in `crates/bav-core/src/calc.rs`, and decisions
# on where the book contradicts itself are in RULINGS.md.
#
# Speeds are meters per combat round. Handling is a threshold: lower is better.

# Environments for Environmental Adaptation (p. 153).
environments = ["Underwater", "Arctic", "Volcanic", "High altitude", "Outer space"]

# Size classes (p. 150). Cargo is in Cargo Factors (CF): 1 CF is half a cubic
# meter and 200 kg, so the small classes' kilograms are written as fractions
# of a CF (1 kg = 0.005 CF).
[[size_class]]
class = 0
length = "0–2 cm"
weight = "~1 kg"
cargo_cf = 0.0

[[size_class]]
class = 1
length = "2–20 cm"
weight = "10 kg"
cargo_cf = 0.0

[[size_class]]
class = 2
length = "21 cm–1 m"
