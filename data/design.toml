# Chassis (p. 150). `kind` is ground, water, air, or drone; a drone's
# `drone_size` sets its Acceleration multiplier (see `calc.rs`). `form` is its
# skin (p. 131): standard unless open (riders outside it, as on a bike) or
# enclosed (drones, p. 132).
[[chassis]]
id = "bike"
form = "open"
name = "Bike"
kind = "ground"
body = 4
armor = 2
handling = 3
seat = 2
build_points = 3
size_class = 4

