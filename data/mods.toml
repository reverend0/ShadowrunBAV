# Vehicle modifications from Shadowrun Sixth World's Double Clutch,
# "Making It Yours" (pp. 120–144). Names and numbers only: what each mod
# does is calculated in `crates/bav-core/src/mods.rs`, and decisions on
# where the book contradicts itself are in RULINGS.md.
#
# Fields (all but id, name, group, and slot_type are optional):
#   group             where the window lists it; "accessory" mods use no slots
#                     and get no do-it-yourself discount (p. 120)
#   slot_type         chassis, powertrain, electronics, either (powertrain or
#                     electronics), or none
#   rating_min/max    its rating range; no rating when left out
#   slots             mod slots, plus slots_per_rating × rating,
#                     slots_per_body × Body (rounded up), slots_per_armor × Armor
#   availability      "4", "4(I)", or "" for none; plus availability_per_rating × rating
#   cost              nuyen, plus cost_per_rating × rating, cost_per_body × Body,
#                     cost_per_armor × Armor, cost_per_rating_body × rating × Body;
#                     cost_small is the price for a bike or a drone (tires)
#   levels            a row per rating, when the book tabulates them
#   cf                Cargo Factors it takes, plus cf_per_rating × rating
#   hardpoint         the hardpoint a device attaches to; provides: the
#                     hardpoint a hardpoint mod adds
#   many              can be installed more than once (a count)
#   exclusive         one choice in this group at a time
#   requires          passenger (not a drone), wheeled, medevac-drone,
#                     small-drone (medium drones and smaller), valkyrie
#   effect            what it changes, worked out in mods.rs
#   book              the sourcebook it's from, when it isn't Double Clutch
#                     (offered only when a design turns that book on)

