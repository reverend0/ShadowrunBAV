[package]
name = "shadowrun-bav"
version = "0.5.0"
description = "Vehicle and drone builder for Shadowrun Sixth World (Double Clutch)"
authors = ["reverend0"]
edition = "2024"
license = "MIT"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids a Windows build issue: https://github.com/rust-lang/cargo/issues/8519
name = "shadowrun_bav_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bav-core = { path = "../crates/bav-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
