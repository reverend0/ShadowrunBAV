<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowrunBAV</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="toolbar">
      <button data-action="new" title="New design (Ctrl+N)">New</button>
      <button data-action="open" title="Open a design (Ctrl+O)">Open</button>
      <button data-action="save" title="Save (Ctrl+S)">Save</button>
      <button data-action="saveAs" title="Save As (Ctrl+Shift+S)">Save As</button>
      <button data-action="exportPdf" title="Export a vehicle sheet, laid out like the book's entries (Ctrl+P)">Export PDF</button>
      <span class="spacer"></span>
      <span id="file">Untitled</span>
    </header>
    <div class="workspace">
      <form id="form" class="form" autocomplete="off"></form>
      <section id="report" class="report" aria-live="polite"></section>
    </div>
  </body>
</html>
